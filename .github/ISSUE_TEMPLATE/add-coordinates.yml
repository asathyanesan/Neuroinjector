name: Add Injection Coordinates
description: Submit a paper's methods text to extract stereotaxic coordinates via FlyerGPT.
title: "[coords] PMID "
labels: ["add-coords"]
body:
  - type: input
    id: pmid
    attributes:
      label: PMID
      description: PubMed ID (digits only)
      placeholder: "40848722"
    validations:
      required: true
  - type: textarea
    id: tsv
    attributes:
      label: TSV table (paste from Excel — optional)
      description: >
        For bulk coordinate tables: copy the rows directly from Excel (this gives
        TAB-separated columns) and paste here. Must include a header row.
        One PMID per table — enter it in the PMID field above.
        Leave blank if you're using the free-text Methods field instead.
      placeholder: "Injection Site\tAP (lambda)\tML\tDV\tangle\tVolume\tTracer used\n..."
      render: text  
  - type: textarea
    id: methods
    attributes:
      label: Methods / coordinate text
      description: Paste the stereotaxic surgery paragraph(s). Include the sentence(s) with AP/ML/DV, volume, and rate.
      placeholder: "Mice were injected... AP -2.8, ML 1.4 relative to lambda... 200 nL at 40 nL/min..."
    validations:
      required: true
  - type: input
    id: species
    attributes:
      label: Species (optional)
      placeholder: "mouse"
